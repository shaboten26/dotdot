<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="dotdot" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#faf6f0"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#292133"
    />
    <script>
      ;(function () {
        try {
          var ua = navigator.userAgent || ''
          var isIos =
            /iPhone|iPad|iPod/i.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
          var isStandalone =
            Boolean(navigator.standalone) ||
            (window.matchMedia &&
              window.matchMedia('(display-mode: standalone)').matches)
          if (isIos && isStandalone) {
            document.documentElement.setAttribute('data-ios-standalone', 'true')
          }
        } catch (_e) {}
      })()
    </script>
    <meta
      name="description"
      content="ブラウザ・ホーム画面からオフラインで使えるドット絵制作専用スタジオ dotdot"
    />
    <title>dotdot - Pixel Art Studio</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  </head>
  <body class="overscroll-none select-none antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
